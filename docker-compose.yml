version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: red_history_db
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: red_history
    # 如果本机已在使用 3306，可以改为 3307:3306 等端口映射
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 初始化脚本：建表 + 导入事件/人物/地点 + B站视频 + 相关资料
      - ./red-history-timeline-backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01_init-db.sql
      - ./red-history-timeline-backend/scripts/import-data-from-json.sql:/docker-entrypoint-initdb.d/02_import-data-from-json.sql
      - ./red-history-timeline-backend/scripts/import-media-bilibili-9.sql:/docker-entrypoint-initdb.d/03_import-media-bilibili-9.sql
      - ./red-history-timeline-backend/scripts/import-materials-from-md.sql:/docker-entrypoint-initdb.d/04_import-materials-from-md.sql

  backend:
    build:
      context: .
      dockerfile: red-history-timeline-backend/Dockerfile
    container_name: red_history_backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/red_history?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVER_PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      dockerfile: red-history-timeline-frontend/Dockerfile
    container_name: red_history_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:

